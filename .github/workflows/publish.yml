name: Publish picks

on:
  # Manual "Run workflow" button on the Actions tab (or the GitHub mobile
  # app) -- this is the on-demand refresh, e.g. once new lineups post.
  workflow_dispatch: {}
  # Baseline refresh so the page isn't stale if nobody triggers it by
  # hand. Every 2 hours, all day (UTC) -- cheap either way: ~12
  # short runs/day is well under the free-tier minutes even on a private
  # repo, and unlimited on a public one. Tune the cron to taste.
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python scripts/generate_site.py --days 3 --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
